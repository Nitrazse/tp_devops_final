name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: docker build -t nitrase/laces-api:latest ./app -f ./app/Dockerfile.txt

      - name: Push Docker image
        run: docker push nitrase/laces-api:latest

      - name: Deploy to k3s
        run: |
          ssh -i ~/vagrant_key -o StrictHostKeyChecking=no vagrant@192.168.56.10 "sudo kubectl apply -f -" < kubernetes/mysql.yaml
          ssh -i ~/vagrant_key -o StrictHostKeyChecking=no vagrant@192.168.56.10 "sudo kubectl apply -f -" < kubernetes/api.yaml
          ssh -i ~/vagrant_key -o StrictHostKeyChecking=no vagrant@192.168.56.10 "sudo kubectl rollout restart deployment/laces-api"

